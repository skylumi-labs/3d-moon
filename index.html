<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<!-- The bucket cannot send headers, so the policy rides in a meta (scripts/csp-meta.test.mts). No frame-ancestors: a meta cannot carry it.
     The MOON_TELEMETRY_CONNECT and MOON_PAGE_TITLE placeholders are filled at build time (src/build/indexHtml.ts): the telemetry hosts come from the build's keys (none without keys), the title from src/branding.ts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://storage.googleapis.com; connect-src 'self' blob: https://storage.googleapis.com %MOON_TELEMETRY_CONNECT% http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>%MOON_PAGE_TITLE%</title>
<!-- Launch head (scripts/launch-head.test.mts). Every build carries it; only the launch build drops the robots meta above.
     The description stays at most 155 characters and claims no more than the data supports. -->
<meta name="description" content="Fly around a 3D Moon in your browser, lit by the real Sun and Earth for any date, from NASA LRO and JAXA Kaguya data, with Apollo 11 and 17 close-ups." />
<link rel="canonical" href="%MOON_SITE_URL%" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="%MOON_PRODUCT_NAME%" />
<meta property="og:title" content="%MOON_PAGE_TITLE%" />
<meta property="og:description" content="Fly around a 3D Moon in your browser, lit by the real Sun and Earth for any date, from NASA LRO and JAXA Kaguya data, with Apollo 11 and 17 close-ups." />
<meta property="og:url" content="%MOON_SITE_URL%" />
<!-- The social card is made on the GPU rig and committed as public/social/moon-1280x640.jpg before launch; the launch build refuses without it. -->
<meta property="og:image" content="%MOON_SITE_URL%social/moon-1280x640.jpg" />
<meta property="og:image:width" content="1280" />
<meta property="og:image:height" content="640" />
<meta property="og:image:alt" content="The Moon in %MOON_PRODUCT_NAME%'s 3D viewer" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="%MOON_PAGE_TITLE%" />
<meta name="twitter:description" content="Fly around a 3D Moon in your browser, lit by the real Sun and Earth for any date, from NASA LRO and JAXA Kaguya data, with Apollo 11 and 17 close-ups." />
<meta name="twitter:image" content="%MOON_SITE_URL%social/moon-1280x640.jpg" />
<meta name="twitter:image:alt" content="The Moon in %MOON_PRODUCT_NAME%'s 3D viewer" />
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"%MOON_PAGE_TITLE%","url":"%MOON_SITE_URL%","description":"Fly around a 3D Moon in your browser, lit by the real Sun and Earth for any date, from NASA LRO and JAXA Kaguya data, with Apollo 11 and 17 close-ups.","applicationCategory":"EducationalApplication","operatingSystem":"Any (a browser with WebGL2)","browserRequirements":"Requires JavaScript and WebGL2","isAccessibleForFree":true,"publisher":{"@type":"Organization","name":"%MOON_PRODUCT_NAME%","url":"%MOON_SITE_ORIGIN%"}}</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8ecf5; overflow: hidden; overscroll-behavior: none; }
  body { font: 0.875rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; overscroll-behavior: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  #ui { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), 0 0 6px rgba(0, 0, 0, 0.45); }
  #ui.hidden { display: none; }
  #hud {
    position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); z-index: 5; max-width: min(620px, calc(100vw - 36px));
    font-size: 0.8125rem; line-height: 1.45; font-variant-numeric: tabular-nums;
  }
  #hud b { font-weight: 600; }
  #hud .sub, #hud .hint { opacity: .62; font-size: 0.75rem; }
  #hud .label { color: #d4e2ff; font-size: 0.75rem; }
  #hud .hint { display: none; }
  #hud .l1 { color: #f1f4fb; }
  .hud-i {
    position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(max(16px, env(safe-area-inset-top, 0px)) + 64px); width: 28px; height: 28px; padding: 0; border-radius: 50%;
    font: italic 600 0.875rem/1 Georgia, 'Times New Roman', serif; color: #e8ecf5; cursor: pointer; pointer-events: auto; text-shadow: none;
    background: rgba(10, 12, 16, 0.6); border: 1px solid rgba(255, 255, 255, 0.28); backdrop-filter: blur(12px);
  }
  .hud-i[hidden] { display: none; }
  .hud-i:hover { background: rgba(40, 48, 64, 0.75); }
  .hud-i:focus-visible { outline: 2px solid #a9c8f5; outline-offset: 2px; }
  .hud-i[aria-pressed='true'] { background: rgba(169, 200, 245, 0.24); border-color: rgba(169, 200, 245, 0.6); }
  .hud-notes {
    position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(max(16px, env(safe-area-inset-top, 0px)) + 104px); width: min(460px, calc(100vw - 36px)); box-sizing: border-box;
    max-height: calc(100vh - 340px); max-height: max(160px, calc(100dvh - 340px - env(safe-area-inset-top, 0px))); overflow-y: auto; padding: 10px 14px 4px; pointer-events: auto; text-shadow: none;
    background: rgba(10, 12, 16, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 12px;
    scrollbar-width: thin; z-index: 4;
  }
  .hud-notes[hidden] { display: none; }
  .hud-notes h2 { margin: 0 0 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  .hud-notes p { margin: 0 0 9px; font-size: 0.7813rem; line-height: 1.5; color: #d4e2ff; }
  /* The brand line, just above the control row (--dock-top is published by dock.ts): "<BRAND_LINE> (Credits)" (src/branding.ts). Under every control, clear of the dock and the flight pad. One line; where large text makes it wider than the screen, "(Credits)" wraps under the address. */
  #credit { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(var(--dock-top, 60px) + 6px); max-width: calc(100vw - 24px); pointer-events: none; z-index: 12; text-shadow: 0 0 2px #000, 0 1px 3px #000, 0 0 10px rgba(0, 0, 0, .9); font-size: 0.6875rem; line-height: 1.4; letter-spacing: .04em; white-space: normal; user-select: none; }
  /* Half transparent at most (never more, hover included); is hidden while the view moves and fades in once it is still (ui/brandFade.ts). The popover is not dimmed. */
  #credit { --brand-max: 0.5; }
  #credit .brand-text, #credit .credit-link { color: #fff; opacity: var(--brand-max); transition: opacity .3s ease; }
  #credit[data-brand='out'] .brand-text, #credit[data-brand='out'] .credit-link { opacity: 0; transition-duration: .6s; }
  #credit[data-brand='out'] .credit-link { pointer-events: none; }
  #credit .credit-link:focus-visible { opacity: 0.9; }
  /* The visible word stays one text line; the 44px touch target is the ::after box around it. */
  #credit .credit-link { pointer-events: auto; position: relative; padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  #credit .credit-link::after { content: ''; position: absolute; left: -8px; right: -8px; top: 50%; height: 44px; transform: translateY(-50%); }
  #credit .credit-link:hover, #credit .credit-link:focus-visible, #credit:focus-within .credit-link { text-decoration: underline; text-underline-offset: 2px; }
  #credit .credit-link:focus-visible, #credit .credit-close:focus-visible, #credit .credit-full a:focus-visible { outline: 2px solid #a9c8f5; outline-offset: 2px; }
  #credit .credit-link:active { scale: .96; }
  #credit .credit-full {
    position: absolute; left: 0; bottom: calc(100% + 8px); width: min(26rem, calc(100vw - 24px)); max-height: min(72vh, 40rem); overflow-y: auto; overscroll-behavior: contain;
    box-sizing: border-box; padding: 14px 16px 12px; white-space: normal; letter-spacing: normal; text-shadow: none; user-select: text; font-size: 0.7813rem; line-height: 1.5; color: #e2e9f5; pointer-events: auto;
    background: rgba(11, 14, 20, 0.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.48), 0 3px 12px rgba(0,0,0,.28); scrollbar-width: thin;
  }
  #credit .credit-full::after { content: ''; position: absolute; left: 0; right: 0; bottom: -7px; height: 7px; }
  #credit .credit-full[hidden] { display: none; }
  #credit .credit-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  #credit .credit-head h2 { margin: 0; font-size: 0.875rem; font-weight: 620; letter-spacing: -.01em; text-wrap: balance; }
  #credit .credit-close { flex: none; min-width: 44px; min-height: 44px; padding: 0 10px; border: 1px solid rgba(255,255,255,.13); border-radius: 11px; background: rgba(255,255,255,.07); color: #d4e2ff; font: inherit; cursor: pointer; }
  #credit .credit-about { padding-bottom: 6px; }
  #credit .credit-about h3 { margin: 6px 0 4px; color: #cbd6e7; font-size: 0.6875rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #credit .credit-about p { margin: 0 0 6px; color: #b9c6da; font-size: 0.7188rem; text-wrap: pretty; }
  #credit .credit-about strong { color: #dbe5f5; font-weight: 600; }
  #credit .credit-intro { margin: 0 0 8px; color: #aebbd0; font-size: 0.7188rem; }
  #credit .credit-sources, #credit .credit-extra-list { list-style: none; margin: 0; padding: 0; }
  #credit .credit-sources > li { padding: 9px 0; border-top: 1px solid rgba(255,255,255,.075); }
  #credit .credit-sources > li.in-view { border-top-color: rgba(169,200,245,.3); }
  #credit .credit-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  #credit .credit-row-head strong { color: #f1f4fb; font-size: 0.75rem; font-weight: 600; }
  #credit .credit-badge { flex: none; padding: 2px 7px; border: 1px solid rgba(169,200,245,.23); border-radius: 999px; color: #c8dbfa; background: rgba(91,125,178,.16); font-size: 0.625rem; line-height: 1.3; }
  #credit .credit-names { margin: 2px 0 0; color: #cbd6e7; font-size: 0.7188rem; text-wrap: pretty; }
  #credit .credit-detail { margin: 3px 0 0; color: #9eacc1; font-size: 0.7188rem; text-wrap: pretty; }
  #credit .credit-links { display: flex; flex-wrap: wrap; gap: 2px 11px; margin-top: 4px; }
  #credit .credit-links a { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; color: #a9c8f5; text-underline-offset: 2px; font-size: 0.6875rem; }
  #credit .credit-extras { padding-top: 9px; border-top: 1px solid rgba(255,255,255,.075); }
  #credit .credit-extras[hidden] { display: none; }
  #credit .credit-extras h3 { margin: 0 0 4px; color: #cbd6e7; font-size: 0.6875rem; font-weight: 600; }
  #credit .credit-extra-list { color: #9eacc1; font-size: 0.6875rem; }
  /* The cold-load preview: black with a line of text while the maps decode (a still of the full Moon would show the wrong phase); main.ts removes it at the first frame. */
  #preview { position: fixed; inset: 0; display: grid; place-items: center; background: #000; pointer-events: none; transition: opacity .45s ease; }
  #preview.done { opacity: 0; }
  #preview .preview-detail { top: calc(50% + 1.6rem); font-size: 0.7rem; opacity: .4; }
  #preview .preview-pulse { position: absolute; left: 50%; top: calc(50% - 1.4rem); width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #eef3ff; opacity: .5; animation: preview-pulse 1.6s ease-in-out infinite; }
  @keyframes preview-pulse { 50% { opacity: .15; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { #preview .preview-pulse { animation: none; } }
  #preview p { position: absolute; left: 0; right: 0; top: 50%; margin: 0; text-align: center; font-size: 0.75rem; letter-spacing: .04em; opacity: .55; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; background: #000;
    padding: 24px; text-align: center; white-space: pre-wrap;
  }
  @media (max-width: 800px) {
    #hud { left: max(14px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); font-size: 0.75rem; max-width: calc(100vw - 28px); }
    .hud-i { left: max(14px, env(safe-area-inset-left, 0px)); top: calc(max(12px, env(safe-area-inset-top, 0px)) + 68px); }
    .hud-notes { left: max(14px, env(safe-area-inset-left, 0px)); top: calc(max(12px, env(safe-area-inset-top, 0px)) + 108px); max-height: calc(100vh - 380px); max-height: max(160px, calc(100dvh - 380px - env(safe-area-inset-top, 0px))); }
    #credit .credit-full { width: min(26rem, calc(100vw - 24px)); max-height: min(72vh, 40rem); padding: 12px 13px; border-radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { #credit .credit-link:active { scale: 1; } #credit .brand-text, #credit .credit-link, #credit[data-brand='out'] .brand-text, #credit[data-brand='out'] .credit-link { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- What a crawler or a browser without JavaScript sees (keep it short and true). Without WebGL2 the boot guard below says so in #err. -->
<noscript><div style="position:fixed;inset:0;z-index:200;overflow:auto;background:#000;padding:24px;max-width:36rem;margin:0 auto;line-height:1.6">
<h1 style="font-size:1.25rem;font-weight:600">%MOON_PAGE_TITLE%</h1>
<p>A 3D Moon you can fly around, lit by the real Sun and Earth for any date, with close-ups of the Apollo 11 and 17 landing sites. It needs JavaScript and a browser with WebGL2.</p>
<p>Maps and terrain: NASA's Scientific Visualization Studio (<a style="color:#a9c8f5" href="https://svs.gsfc.nasa.gov/4720/">CGI Moon Kit</a>), LROC and LOLA (NASA/GSFC/Arizona State University, NASA/GSFC/MIT), SLDEM2015 (Barker et al. 2016), and the SELENE (Kaguya) Terrain Camera, ISAS/JAXA (modified). The full credits are under Credits in the viewer.</p>
</div></noscript>
<div id="preview" role="status"><p>Loading the Moon…</p><p class="preview-detail"></p><span class="preview-pulse" aria-hidden="true"></span></div>
<div id="ui"></div>
<div id="err"></div>
<script id="boot-guard" src="/boot-guard.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
