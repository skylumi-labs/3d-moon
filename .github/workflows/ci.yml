name: ci
# Safe for forks: `pull_request` (never `pull_request_target`), a read-only token, no secrets, no cloud credentials.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Pull requests run the fast tier (the slow data tests in scripts/run-tests-lib.mjs are skipped, each skip printed); main runs everything.
      - name: Test
        env:
          TEST_TIER: ${{ github.event_name == 'pull_request' && 'fast' || '' }}
        run: npm test
      - name: Build
        run: npm run build   # tsc, vite build and the dist guard (scripts/assert-dist-public.mjs); the same command CONTRIBUTING.md names
      - name: Lint
        run: npm run lint
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "/tmp/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  /tmp/$archive" | sha256sum --check --status
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
      - name: Scan full history
        run: /tmp/gitleaks git --redact --no-banner --no-color --log-opts="--all" .
