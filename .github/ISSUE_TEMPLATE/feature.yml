name: Feature request
description: An idea for the viewer. Open-ended ideas fit Discussions better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
